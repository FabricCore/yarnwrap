plugins {
    id "fabric-loom" version "1.13-SNAPSHOT"
    id "com.modrinth.minotaur" version "2.+"
    id 'maven-publish'
}

base {
    version = project.mod_version
    group = project.maven_group
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc:mapping-io:${mappingio_version}"
    include "net.fabricmc:mapping-io:${mappingio_version}"
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesBaseName}" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}

publishing {
  repositories {
    maven {
      name = "siriReposilite"
      url = "https://maven.siri.ws/${project.maven_channel}"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    maven(MavenPublication) {
      groupId = "ws.siri"
      artifactId = "yarnwrap"
      version = "${project.minecraft_version}-${project.mod_version}-${project.loader}"
      from components.java
    }
  }
}

java {
    withSourcesJar()
    withJavadocJar()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "yarnwrap"
    versionNumber = "${project.mod_version}"
    versionName = "JSCore ${project.mod_version}"
    versionType = "${project.modrinth_channel}"
    uploadFile = remapJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "yarnwrap"
    }
}
